<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ລົງທະບຽນເຂົ້າຮ່ວມງານ · TPLUS Happy New Year 2027</title>
<link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Poppins', 'Noto Sans Lao', sans-serif; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.05); opacity: 1 } 100% { transform: scale(1) } }
  .pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes shake { 0%,100% { transform: translateX(0) } 20%,60% { transform: translateX(-8px) } 40%,80% { transform: translateX(8px) } }
  .shake { animation: shake .4s ease; }
</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-[#FFD60A] via-[#FFF4C2] to-white text-[#1A1400]">
  <div class="max-w-md mx-auto px-5 py-8">
    <div class="text-center">
      <img src="/logo.png" alt="TPLUS" class="h-20 w-20 mx-auto rounded-2xl shadow-lg">
      <h1 class="mt-4 text-2xl font-extrabold">TPLUS Happy New Year 2027</h1>
      <p class="mt-1 font-semibold">ລົງທະບຽນເຂົ້າຮ່ວມງານ ⭐ ລຸ້ນລາງວັນພິເສດ</p>
    </div>

    <form id="form" class="mt-6 bg-white rounded-3xl shadow-xl border-4 border-[#FFD60A] p-5 space-y-4">
      <label class="block">
        <span class="text-base font-bold">ລະຫັດພະນັກງານ (Staff ID)</span>
        <input id="staffId" required autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ເຊັ່ນ: VIP23-1115"
          class="mt-2 w-full rounded-2xl border-2 border-[#FFD60A] px-4 py-4 text-2xl font-bold tracking-wider text-center uppercase focus:outline-none focus:ring-4 focus:ring-yellow-200">
      </label>
      <div id="msg" class="hidden rounded-2xl px-4 py-3 text-sm font-semibold"></div>
      <button id="submit" class="w-full rounded-2xl bg-[#1A1400] text-[#FFD60A] text-xl font-extrabold py-4 active:scale-95 transition disabled:opacity-50">ລົງທະບຽນ ✔</button>
      <p class="text-xs text-center opacity-60">ລະບົບຈະກວດລະຫັດກັບລາຍຊື່ພະນັກງານ · 1 ລະຫັດ ລົງທະບຽນໄດ້ 1 ເທື່ອ</p>
    </form>

    <div id="done" class="hidden pop mt-6 bg-white rounded-3xl shadow-xl border-4 border-[#FFD60A] p-6 text-center">
      <div class="text-6xl">🎉</div>
      <h2 class="mt-3 text-2xl font-extrabold">ລົງທະບຽນສຳເລັດ!</h2>
      <p id="doneName" class="mt-3 text-2xl font-extrabold"></p>
      <p id="doneMeta" class="mt-1 text-sm font-semibold opacity-70"></p>
      <p class="mt-4 text-sm opacity-70">ລາຍຊື່ຂອງທ່ານຢູ່ໃນວົງລໍ້ລາງວັນພິເສດແລ້ວ<br>ຂໍໃຫ້ໂຊກດີ! 🍀</p>
      <button id="again" class="mt-5 text-sm font-bold underline opacity-70">ລົງທະບຽນໃຫ້ຄົນອື່ນ</button>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const saved = JSON.parse(localStorage.getItem('registered') || 'null');
if (saved && saved.staffId) showDone(saved);

function showMsg(text, kind) {
  const m = $('#msg');
  m.textContent = text;
  m.className = 'rounded-2xl px-4 py-3 text-sm font-semibold ' + (kind === 'error' ? 'bg-red-50 text-red-700 border-2 border-red-300' : 'bg-yellow-50 text-[#1A1400] border-2 border-[#FFD60A]');
  if (kind === 'error') { $('#form').classList.remove('shake'); void $('#form').offsetWidth; $('#form').classList.add('shake'); }
}

$('#staffId').addEventListener('input', () => $('#msg').classList.add('hidden'));

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const staffId = $('#staffId').value.trim();
  if (!staffId) return;
  $('#submit').disabled = true; $('#submit').textContent = 'ກຳລັງກວດສອບ...';
  try {
    const r = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ staffId }) });
    const d = await r.json();
    if (d.ok) {
      localStorage.setItem('registered', JSON.stringify(d.attendee));
      showDone(d.attendee);
    } else if (d.code === 'duplicate') {
      const t = d.attendee?.time ? new Date(d.attendee.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      showMsg(`⚠ ລະຫັດ ${d.attendee?.staffId || staffId.toUpperCase()} (${d.attendee?.name || ''}) ລົງທະບຽນແລ້ວ${t ? ' ເວລາ ' + t : ''} — ບໍ່ສາມາດລົງທະບຽນຊ້ຳໄດ້`, 'error');
    } else {
      showMsg('❌ ' + (d.error || 'ລົງທະບຽນບໍ່ສຳເລັດ'), 'error');
    }
  } catch {
    showMsg('❌ ເຊື່ອມຕໍ່ບໍ່ໄດ້ ກະລຸນາລອງໃໝ່', 'error');
  } finally {
    $('#submit').disabled = false; $('#submit').textContent = 'ລົງທະບຽນ ✔';
  }
});

function showDone(a) {
  $('#form').classList.add('hidden');
  $('#done').classList.remove('hidden');
  $('#doneName').textContent = a.name;
  $('#doneMeta').textContent = [a.staffId, a.department].filter(Boolean).join(' · ');
}
$('#again').onclick = () => {
  localStorage.removeItem('registered');
  $('#done').classList.add('hidden');
  $('#form').classList.remove('hidden');
  $('#staffId').value = ''; $('#msg').classList.add('hidden'); $('#staffId').focus();
};
</script>
</body>
</html>
