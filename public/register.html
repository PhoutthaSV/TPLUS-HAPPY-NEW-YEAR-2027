<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ລົງທະບຽນເຂົ້າຮ່ວມງານ · TPLUS Happy New Year 2027</title>
<link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Poppins', 'Noto Sans Lao', sans-serif; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.05); opacity: 1 } 100% { transform: scale(1) } }
  .pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.3) both; }
</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-[#FFD60A] via-[#FFF4C2] to-white text-[#1A1400]">
  <div class="max-w-md mx-auto px-5 py-8">
    <div class="text-center">
      <img src="/logo.png" alt="TPLUS" class="h-20 w-20 mx-auto rounded-2xl shadow-lg">
      <h1 class="mt-4 text-2xl font-extrabold">TPLUS Happy New Year 2027</h1>
      <p class="mt-1 font-semibold">ລົງທະບຽນເຂົ້າຮ່ວມງານ ⭐ ລຸ້ນລາງວັນພິເສດ</p>
    </div>

    <form id="form" class="mt-6 bg-white rounded-3xl shadow-xl border-4 border-[#FFD60A] p-5 space-y-4">
      <label class="block">
        <span class="text-sm font-bold">ລະຫັດພະນັກງານ (Staff ID)</span>
        <input id="staffId" autocomplete="off" autocapitalize="characters" placeholder="ເຊັ່ນ: VIP23-1115" class="mt-1 w-full rounded-xl border-2 border-[#FFD60A] px-4 py-3 text-lg uppercase focus:outline-none focus:ring-4 focus:ring-yellow-200">
        <span id="lookupMsg" class="text-xs mt-1 block min-h-[1rem]"></span>
      </label>
      <label class="block">
        <span class="text-sm font-bold">ຊື່ ແລະ ນາມສະກຸນ <span class="text-red-600">*</span></span>
        <input id="name" required placeholder="ຊື່ ແລະ ນາມສະກຸນ" class="mt-1 w-full rounded-xl border-2 border-[#FFD60A] px-4 py-3 text-lg focus:outline-none focus:ring-4 focus:ring-yellow-200">
      </label>
      <label class="block">
        <span class="text-sm font-bold">ພະແນກ</span>
        <input id="department" placeholder="ພະແນກ" class="mt-1 w-full rounded-xl border-2 border-[#FFD60A] px-4 py-3 text-lg focus:outline-none focus:ring-4 focus:ring-yellow-200">
      </label>
      <label class="block">
        <span class="text-sm font-bold">ເບີໂທ</span>
        <input id="phone" type="tel" inputmode="tel" placeholder="020 xxxx xxxx" class="mt-1 w-full rounded-xl border-2 border-[#FFD60A] px-4 py-3 text-lg focus:outline-none focus:ring-4 focus:ring-yellow-200">
      </label>
      <p id="err" class="hidden text-red-600 font-semibold text-sm"></p>
      <button id="submit" class="w-full rounded-2xl bg-[#1A1400] text-[#FFD60A] text-xl font-extrabold py-4 active:scale-95 transition disabled:opacity-50">ລົງທະບຽນ ✔</button>
    </form>

    <div id="done" class="hidden pop mt-6 bg-white rounded-3xl shadow-xl border-4 border-[#FFD60A] p-6 text-center">
      <div class="text-6xl">🎉</div>
      <h2 id="doneTitle" class="mt-3 text-2xl font-extrabold">ລົງທະບຽນສຳເລັດ!</h2>
      <p id="doneName" class="mt-2 text-xl font-bold"></p>
      <p class="mt-3 text-sm opacity-70">ລາຍຊື່ຂອງທ່ານຢູ່ໃນວົງລໍ້ລາງວັນພິເສດແລ້ວ<br>ຂໍໃຫ້ໂຊກດີ! 🍀</p>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const saved = JSON.parse(localStorage.getItem('registered') || 'null');
if (saved) showDone(saved, true);

let t = null;
$('#staffId').addEventListener('input', () => {
  clearTimeout(t);
  const id = $('#staffId').value.trim();
  $('#lookupMsg').textContent = '';
  if (id.length < 4) return;
  t = setTimeout(async () => {
    try {
      const r = await (await fetch('/api/lookup?id=' + encodeURIComponent(id))).json();
      if (r.disabled) return; // online: staff lookup is turned off for privacy
      if (r.found) {
        $('#name').value = r.name; $('#department').value = r.department || '';
        $('#lookupMsg').textContent = '✅ ພົບຂໍ້ມູນພະນັກງານ'; $('#lookupMsg').className = 'text-xs mt-1 block text-green-700 font-semibold';
      } else {
        $('#lookupMsg').textContent = 'ບໍ່ພົບລະຫັດນີ້ — ກະລຸນາປ້ອນຊື່ເອງ'; $('#lookupMsg').className = 'text-xs mt-1 block opacity-60';
      }
    } catch {}
  }, 350);
});

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = { staffId: $('#staffId').value, name: $('#name').value, department: $('#department').value, phone: $('#phone').value };
  $('#submit').disabled = true; $('#err').classList.add('hidden');
  try {
    const r = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'ລົງທະບຽນບໍ່ສຳເລັດ');
    localStorage.setItem('registered', JSON.stringify(d.attendee));
    showDone(d.attendee, d.already);
  } catch (err) {
    $('#err').textContent = err.message || 'ເຊື່ອມຕໍ່ບໍ່ໄດ້ ກະລຸນາລອງໃໝ່'; $('#err').classList.remove('hidden');
  } finally { $('#submit').disabled = false; }
});

function showDone(a, already) {
  $('#form').classList.add('hidden');
  $('#done').classList.remove('hidden');
  $('#doneTitle').textContent = already ? 'ທ່ານລົງທະບຽນແລ້ວ ✔' : 'ລົງທະບຽນສຳເລັດ!';
  $('#doneName').textContent = a.name + (a.staffId ? ' (' + a.staffId + ')' : '');
}
</script>
</body>
</html>
